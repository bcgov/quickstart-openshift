# Coraza WAF Configuration
# Basic WAF configuration with security rules

# Enable rules engine
SecRuleEngine On

# Request body handling
# Request body limits:
# - Any body: ~12.5MB (SecRequestBodyLimit 13107200); larger bodies get 413
# - Non-file payloads: SecRequestBodyNoFilesLimit is set to 512KB (524288)
#   but Coraza does not enforce it (corazawaf/coraza#896). Only JSON is
#   capped at 512KB, by rule 1010 below.
# Adjust based on your application's needs (file uploads, API payloads, etc.)
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 524288

# Response body handling
# Disabled since no response body inspection rules are configured
# Enable if you plan to add response body inspection rules in the future
# When enabled, configure SecResponseBodyMimeType and SecResponseBodyLimit
SecResponseBodyAccess Off

# File upload handling
# Directories are created in the Dockerfile with OpenShift-compatible permissions (770, GID 0)
# In production, consider using persistent volumes with restricted permissions
SecTmpDir /tmp/coraza/
SecDataDir /tmp/coraza/

# Logging
# RelevantOnly: Only logs transactions that trigger rules or cause errors
# This reduces log volume but means allowed requests won't have audit trails
# For full audit trails (compliance), use SecAuditEngine On with log rotation
SecAuditEngine RelevantOnly
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /dev/stdout

# Debug log (disabled in production with level 0)
SecDebugLog /dev/stdout
SecDebugLogLevel 0

# JSON request bodies
# Parse application/json and application/*+json bodies into ARGS (e.g.
# ARGS:json.name, ARGS:json.tags.0) so rules 1001, 1002, 1007 and 1008
# inspect API payloads too. Other content types are unchanged.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^application/(?:[a-z0-9.-]+\+)?json(?:\s*;|$)" \
    "id:1000,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON"

# Reject JSON bodies that fail to parse. Otherwise an invalid body would
# skip inspection entirely; the backend rejects invalid JSON with 400
# anyway, so legitimate clients see no change. Other body types are unchanged.
# Tune: SecRuleRemoveById 1006 to let unparseable JSON through uninspected.
SecRule REQBODY_PROCESSOR "@streq JSON" \
    "id:1006,phase:2,deny,log,status:400,msg:'Invalid JSON request body: %{REQBODY_ERROR_MSG}',chain"
    SecRule REQBODY_ERROR "!@eq 0"

# Reject JSON bodies with more values than SecArgumentsLimit (Coraza default
# 1000). Values past the limit are dropped before the rules run, so they
# would otherwise go uninspected.
# Tune: raise the limit, e.g. SecArgumentsLimit 5000, rather than removing this.
SecRule REQBODY_PROCESSOR "@streq JSON" \
    "id:1009,phase:2,deny,log,status:400,msg:'arguments exceed SecArgumentsLimit',chain"
    SecRule ARGUMENTS_LIMIT_REACHED "@eq 1"

# Reject JSON bodies over 512KB (see Request body limits above), using
# Content-Length because the JSON body processor does not populate REQUEST_BODY_LENGTH.
# Runs in phase 1 (after rule 1000), so oversized bodies are not parsed.
# Chunked bodies without Content-Length are still capped by SecRequestBodyLimit.
# Tune: change 524288 here.
SecRule REQBODY_PROCESSOR "@streq JSON" \
    "id:1010,phase:1,deny,log,status:413,msg:'JSON request body over 512KB',chain"
    SecRule REQUEST_HEADERS:Content-Length "@gt 524288"

# Attack rules
# - Rules 1001-1004, 1007 and 1008 deny matching requests with 403.
# - Rule 1005 is detect-only (pass, log): its keyword regex matches ordinary
#   text such as "please delete from my list", "-- note" or "sp_code".
#   Rule 1001 (libinjection) blocks real SQL injection instead.
# - Disruptive actions are explicit on every rule; `block` would inherit
#   Coraza's default action (phase:2,log,auditlog,pass) and only log.
# - These rules inspect query strings, form fields, JSON body fields
#   (via rule 1000) and headers.
#
# Tuning without editing the rules below:
# add these after the rules, except where noted.
#   Disable one rule:
#     SecRuleRemoveById 1002
#   Make one rule detect-only (log, don't block):
#     SecRuleUpdateActionById 1001 "pass"
#   Stop one rule inspecting a single field (JSON fields are json.<path>):
#     SecRuleUpdateTargetById 1001 "!ARGS:comment"
#     SecRuleUpdateTargetById 1002 "!ARGS:json.notes"
#   Skip one rule for a path (put this above the rules, so it also
#   works for phase:1 rules such as 1004):
#     SecRule REQUEST_URI "@beginsWith /api/v1/notes" \
#         "id:2001,phase:1,pass,nolog,ctl:ruleRemoveById=1001"
#   Whole WAF detect-only (e.g. while testing in DEV):
#     SecRuleEngine DetectionOnly
# Use your own rule ids (e.g. 2000-2999); ids must be unique.

# Generic attack detection using Coraza's built-in operators
SecRule REQUEST_HEADERS|ARGS|ARGS_NAMES "@detectSQLi" \
    "id:1001,phase:2,deny,log,msg:'SQL Injection Attack Detected',status:403"

SecRule REQUEST_HEADERS|ARGS|ARGS_NAMES "@detectXSS" \
    "id:1002,phase:2,deny,log,msg:'XSS Attack Detected',status:403"

# Block common security scanners by User-Agent with word boundaries
# Note: Burp Suite is excluded to allow authorized security testing
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)\b(nikto|sqlmap|nmap|masscan|nessus|openvas|acunetix)\b" \
    "id:1003,phase:1,deny,log,msg:'Known Security Scanner Detected',status:403"

# Block access to sensitive paths - anchored to beginning of URI
# This intentionally blocks common paths targeted by attackers (/.env, /.git, /admin, etc.)
# The pattern matches both /path and /path/ for comprehensive protection
# If your application legitimately uses one of these paths, skip this rule for it
# (before this rule, see Tuning above):
#   SecRule REQUEST_URI "@rx ^/admin(/|$)" "id:2002,phase:1,pass,nolog,ctl:ruleRemoveById=1004"
# Or modify this rule to exclude specific paths from the block list
SecRule REQUEST_URI "@rx ^/(admin|config|backup|tmp|logs|wp-admin|\.env|\.git|\.htaccess|\.htpasswd|\.ssh|\.aws|web\.config)(/|$)" \
    "id:1004,phase:1,deny,log,msg:'Access to sensitive path blocked',status:403"

# Common attack patterns - SQL Injection (enhanced with comments and procedure calls)
# Detect-only (pass): matches ordinary text, see note above
# Uses word boundaries and whitespace requirements to reduce false positives
# SQL comment patterns: --(\s|$) matches comments with whitespace or end of string
# /\*[^*]*\*+/ matches SQL block comments (safer regex to prevent ReDoS)
SecRule ARGS "@rx (?i)(union\s+select|insert\s+into|delete\s+from|drop\s+table|update\s+set|exec\s*\(|execute\s*\(|\bsp_|\bxp_|--(\s|$)|/\*[^*]*\*+/)" \
    "id:1005,phase:2,pass,log,msg:'SQL Injection Pattern Detected'"

# Path traversal protection - comprehensive encoding variations
SecRule REQUEST_URI|ARGS "@rx (?i)(\.\.(/|\\|%2f|%5c)|(%2e%2e|%252e%252e)(/|\\|%2f|%5c))" \
    "id:1007,phase:2,deny,log,msg:'Path Traversal Attempt Detected',status:403"

# Null byte injection
SecRule REQUEST_URI|ARGS|REQUEST_HEADERS "@rx \x00" \
    "id:1008,phase:2,deny,log,msg:'Null Byte Injection Detected',status:403"
