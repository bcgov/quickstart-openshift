apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    value: quickstart-openshift
  - name: ZONE
    description: Deployment zone, e.g. pr-###, test, or prod
    required: true
  - name: S3_BUCKET
    description: S3 bucket name for off-cluster database backups
    value: ""
  - name: S3_ENDPOINT
    description: S3 endpoint URL (e.g. https://nrs.objectstore.gov.bc.ca)
    value: ""
  - name: S3_USER
    description: S3 access key ID for database backups
    value: ""
  - name: S3_PASSWORD
    description: S3 secret access key for database backups
    value: ""
objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-database-backup
      labels:
        app: ${NAME}-${ZONE}
    stringData:
      s3-bucket: ${S3_BUCKET}
      s3-endpoint: ${S3_ENDPOINT}
      s3-user: ${S3_USER}
      s3-password: ${S3_PASSWORD}
