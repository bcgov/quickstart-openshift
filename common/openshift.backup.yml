apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    required: true
  - name: COMPONENT
    description: Component name
    value: database-backup
  - name: DB_COMPONENT
    description: Target database component name
    value: database
  - name: ZONE
    description: Deployment zone, e.g. pr-###, test, or prod
    required: true
  - name: DB_IMAGE
    description: Database image repository (matching the database StatefulSet)
    value: postgres
  - name: PG_VERSION
    description: Tag for DB_IMAGE (matching the database StatefulSet)
    value: "17"
  - name: AWS_CLI_IMAGE
    description: AWS CLI image used for S3 upload and retention pruning
    value: amazon/aws-cli:2.39.1
  - name: BACKUP_SUSPEND
    description: Suspend backup CronJob execution (default true; set false to enable)
    value: "true"
  - name: SCHEDULE
    description: Cron expression for backup execution schedule
    value: "30 8 * * *" # Daily at 08:30 UTC
  - name: NUM_BACKUPS
    description: Number of daily backup dumps to retain in S3 bucket before pruning
    value: "7"
  - name: SUCCESS_JOBS_HISTORY_LIMIT
    description: Number of successful jobs to retain
    value: "3"
  - name: FAILED_JOBS_HISTORY_LIMIT
    description: Number of failed jobs to retain
    value: "3"
  - name: JOB_BACKOFF_LIMIT
    description: Number of attempts to try for a successful job outcome
    value: "0"

objects:
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}
      labels:
        app: ${NAME}-${ZONE}
        cronjob: ${NAME}-${ZONE}-backup
    spec:
      schedule: "${SCHEDULE}"
      suspend: ${{BACKUP_SUSPEND}}
      concurrencyPolicy: "Replace"
      successfulJobsHistoryLimit: ${{SUCCESS_JOBS_HISTORY_LIMIT}}
      failedJobsHistoryLimit: ${{FAILED_JOBS_HISTORY_LIMIT}}
      jobTemplate:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            cronjob: ${NAME}-${ZONE}-backup
        spec:
          backoffLimit: ${{JOB_BACKOFF_LIMIT}}
          template:
            metadata:
              labels:
                app: ${NAME}-${ZONE}
                cronjob: ${NAME}-${ZONE}-backup
            spec:
              restartPolicy: "Never"
              terminationGracePeriodSeconds: 30
              volumes:
                - name: scratch
                  emptyDir: {}
              initContainers:
                # 1. Dump database with 1:1 pg_dump client/server parity & verify archive TOC
                - name: dump
                  image: ${DB_IMAGE}:${PG_VERSION}
                  imagePullPolicy: IfNotPresent
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -eu
                      BACKUP_DIR="/backups"
                      TARGET_DUMP="${BACKUP_DIR}/backup_$(date +%Y-%m-%d).dump"
                      TEMP_DUMP="${TARGET_DUMP}.tmp"

                      cleanup() {
                        rm -f "${TEMP_DUMP}" || true
                      }
                      trap cleanup EXIT
                      trap 'exit 130' INT
                      trap 'exit 143' TERM

                      echo "Cleaning stale temporary dumps in scratch..."
                      find "${BACKUP_DIR}" -maxdepth 1 -type f -name "*.tmp" -exec rm -f {} \;

                      echo "Creating database dump..."
                      pg_dump \
                        -U "${POSTGRES_USER}" \
                        -h "${NAME}-${ZONE}-${DB_COMPONENT}" \
                        -d "${POSTGRES_DB}" \
                        -Fc \
                        --file="${TEMP_DUMP}"

                      echo "Verifying dump readability and archive integrity..."
                      pg_restore --list "${TEMP_DUMP}" > /dev/null

                      mv "${TEMP_DUMP}" "${TARGET_DUMP}"
                      echo "Dump created and verified successfully: ${TARGET_DUMP}"
                  env:
                    - name: POSTGRES_DB
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-name
                    - name: POSTGRES_USER
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-user
                    - name: PGPASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-password
                  volumeMounts:
                    - name: scratch
                      mountPath: /backups
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
              containers:
                # 2. Upload dump to S3 / ObjectStore and prune remote backups older than NUM_BACKUPS
                - name: s3-sync
                  image: ${AWS_CLI_IMAGE}
                  imagePullPolicy: IfNotPresent
                  entrypoint: ["/bin/sh", "-c"]
                  command:
                    - |
                      set -eu
                      BACKUP_DIR="/backups"
                      BACKUP_PREFIX="${NAME}/${ZONE}/"
                      S3_TARGET="s3://${S3_BUCKET}/${BACKUP_PREFIX}"

                      echo "Uploading database backup to ${S3_TARGET}..."
                      for dump in "${BACKUP_DIR}"/backup_*.dump; do
                        [ -f "${dump}" ] || continue
                        aws s3 cp "${dump}" "${S3_TARGET}"
                        echo "Uploaded $(basename "${dump}") to S3."
                      done

                      echo "Pruning S3 backups older than ${NUM_BACKUPS} days..."
                      PRUNE_CUTOFF_SEC=$(date -d "${NUM_BACKUPS} days ago" +%s)
                      aws s3 ls "${S3_TARGET}" | while read -r date time size filename; do
                        [ -n "${filename:-}" ] || continue
                        case "${filename}" in
                          backup_*.dump)
                            obj_sec=$(date -d "${date} ${time}" +%s 2>/dev/null || :)
                            if [ -n "${obj_sec}" ] && [ "${obj_sec}" -lt "${PRUNE_CUTOFF_SEC}" ]; then
                              echo "Pruning expired backup: ${S3_TARGET}${filename}"
                              aws s3 rm "${S3_TARGET}${filename}"
                            fi
                            ;;
                        esac
                      done
                      echo "S3 sync and retention pruning completed."
                  env:
                    - name: S3_BUCKET
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-bucket
                    - name: AWS_ENDPOINT_URL
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-endpoint
                          optional: true
                    - name: AWS_ACCESS_KEY_ID
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-user
                    - name: AWS_SECRET_ACCESS_KEY
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-password
                    - name: AWS_DEFAULT_REGION
                      value: ca-central-1
                    - name: HOME
                      value: /tmp
                  volumeMounts:
                    - name: scratch
                      mountPath: /backups
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
