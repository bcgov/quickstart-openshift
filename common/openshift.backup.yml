apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    value: quickstart-openshift
  - name: COMPONENT
    description: Component name
    value: database
  - name: ZONE
    description: Deployment zone, e.g. pr-###, test, or prod
    required: true
  - name: DB_IMAGE
    description: Database image repository, e.g. postgres, or postgis/postgis for spatial (GIS) support
    value: postgres
  - name: PG_VERSION
    description: Tag for DB_IMAGE, e.g. 17 for postgres or 17-3.5 for postgis/postgis
    value: "17"
  - name: AWS_CLI_IMAGE
    description: AWS CLI image used for S3 upload and retention pruning
    value: amazon/aws-cli:2.39.1
  - name: BACKUP_SUSPEND
    description: Suspend backup CronJob execution (default false; runs nightly)
    value: "false"
  - name: BACKUP_SCHEDULE
    description: Cron expression for backup execution schedule
    value: "30 8 * * *" # Daily at 08:30 UTC
  - name: NUM_BACKUPS
    description: Number of daily backup dumps to retain in S3 bucket before pruning
    value: "7"
  - name: BACKUP_FILE
    description: Specific backup filename to restore (leave blank for latest backup in S3)
    value: ""
  - name: S3_BUCKET
    description: S3 bucket name for off-cluster database backups
    value: ""
  - name: S3_ENDPOINT
    description: S3 endpoint URL (e.g. https://nrs.objectstore.gov.bc.ca)
    value: ""
  - name: S3_USER
    description: S3 access key ID for database backups
    value: ""
  - name: S3_PASSWORD
    description: S3 secret access key for database backups
    value: ""

objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-database-backup
      labels:
        app: ${NAME}-${ZONE}
    stringData:
      s3-bucket: ${S3_BUCKET}
      s3-endpoint: ${S3_ENDPOINT}
      s3-user: ${S3_USER}
      s3-password: ${S3_PASSWORD}

  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-database-backup-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-${ZONE}
                  cronjob: ${NAME}-${ZONE}-backup
            - podSelector:
                matchLabels:
                  app: ${NAME}-${ZONE}
                  cronjob: ${NAME}-${ZONE}-restore
          ports:
            - protocol: TCP
              port: 5432
      policyTypes:
        - Ingress

  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}-backup
      labels:
        app: ${NAME}-${ZONE}
        cronjob: ${NAME}-${ZONE}-backup
    spec:
      schedule: "${BACKUP_SCHEDULE}"
      suspend: ${{BACKUP_SUSPEND}}
      concurrencyPolicy: "Replace"
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      jobTemplate:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            cronjob: ${NAME}-${ZONE}-backup
        spec:
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: ${NAME}-${ZONE}
                cronjob: ${NAME}-${ZONE}-backup
            spec:
              restartPolicy: "Never"
              terminationGracePeriodSeconds: 30
              volumes:
                - name: scratch
                  emptyDir: {}
              initContainers:
                # 1. Dump database with 1:1 pg_dump client/server parity & verify archive TOC
                - name: dump
                  image: ${DB_IMAGE}:${PG_VERSION}
                  imagePullPolicy: IfNotPresent
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -eu
                      BACKUP_DIR="/backups"

                      if [ -z "$S3_BUCKET" ]; then
                        echo "======================================================================"
                        echo "NOTICE: Database backup skipped - S3_BUCKET is not configured."
                        echo "To enable automated offsite database backups, provide S3 variables:"
                        echo "  - vars.S3_BUCKET"
                        echo "  - vars.S3_ENDPOINT (e.g. https://nrs.objectstore.gov.bc.ca)"
                        echo "  - secrets.s3_user (Access Key ID)"
                        echo "  - secrets.s3_password (Secret Access Key)"
                        echo "======================================================================"
                        touch "$BACKUP_DIR/SKIPPED_NO_S3"
                        exit 0
                      fi

                      TARGET_DUMP="$BACKUP_DIR/backup_$(date +%Y-%m-%d).dump"
                      TEMP_DUMP="$TARGET_DUMP.tmp"

                      cleanup() {
                        rm -f "$TEMP_DUMP" || true
                      }
                      trap cleanup EXIT
                      trap 'exit 130' INT
                      trap 'exit 143' TERM

                      echo "Cleaning stale temporary dumps in scratch..."
                      find "$BACKUP_DIR" -maxdepth 1 -type f -name "*.tmp" -exec rm -f {} \;

                      echo "Creating database dump..."
                      pg_dump \
                        -U "${POSTGRES_USER}" \
                        -h "${NAME}-${ZONE}-${COMPONENT}" \
                        -d "${POSTGRES_DB}" \
                        -Fc \
                        --file="$TEMP_DUMP"

                      echo "Verifying dump readability and archive integrity..."
                      pg_restore --list "$TEMP_DUMP" > /dev/null

                      mv "$TEMP_DUMP" "$TARGET_DUMP"
                      echo "Dump created and verified successfully: $TARGET_DUMP"
                  env:
                    - name: S3_BUCKET
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-bucket
                          optional: true
                    - name: POSTGRES_DB
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-name
                    - name: POSTGRES_USER
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-user
                    - name: PGPASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-password
                  volumeMounts:
                    - name: scratch
                      mountPath: /backups
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
              containers:
                # 2. Upload dump to S3 / ObjectStore and prune remote backups older than NUM_BACKUPS
                - name: s3-sync
                  image: ${AWS_CLI_IMAGE}
                  imagePullPolicy: IfNotPresent
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -eu
                      BACKUP_DIR="/backups"

                      if [ -f "$BACKUP_DIR/SKIPPED_NO_S3" ] || [ -z "$S3_BUCKET" ]; then
                        echo "======================================================================"
                        echo "NOTICE: S3 sync skipped - S3_BUCKET is not configured."
                        echo "======================================================================"
                        exit 0
                      fi

                      BACKUP_PREFIX="${NAME}/${ZONE}/"
                      S3_TARGET="s3://$S3_BUCKET/${BACKUP_PREFIX}"

                      echo "Uploading database backup to $S3_TARGET..."
                      for dump in "$BACKUP_DIR"/backup_*.dump; do
                        [ -f "$dump" ] || continue
                        aws s3 cp "$dump" "$S3_TARGET"
                        echo "Uploaded $(basename "$dump") to S3."
                      done

                      echo "Pruning S3 backups older than ${NUM_BACKUPS} days..."
                      PRUNE_CUTOFF_SEC=$(date -d "${NUM_BACKUPS} days ago" +%s)
                      aws s3 ls "$S3_TARGET" | while read -r date time size filename; do
                        [ -n "$filename" ] || continue
                        case "$filename" in
                          backup_*.dump)
                            obj_sec=$(date -d "$date $time" +%s 2>/dev/null || :)
                            if [ -n "$obj_sec" ] && [ "$obj_sec" -lt "$PRUNE_CUTOFF_SEC" ]; then
                              echo "Pruning expired backup: $S3_TARGET$filename"
                              aws s3 rm "$S3_TARGET$filename"
                            fi
                            ;;
                        esac
                      done
                      echo "S3 sync and retention pruning completed."
                  env:
                    - name: S3_BUCKET
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-bucket
                          optional: true
                    - name: AWS_ENDPOINT_URL
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-endpoint
                          optional: true
                    - name: AWS_ACCESS_KEY_ID
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-user
                          optional: true
                    - name: AWS_SECRET_ACCESS_KEY
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-password
                          optional: true
                    - name: AWS_DEFAULT_REGION
                      value: ca-central-1
                    - name: HOME
                      value: /tmp
                  volumeMounts:
                    - name: scratch
                      mountPath: /backups
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault

  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}-restore
      labels:
        app: ${NAME}-${ZONE}
        cronjob: ${NAME}-${ZONE}-restore
    spec:
      schedule: "0 0 31 2 *" # Dormant schedule (Feb 31st never triggers automatically)
      suspend: true
      concurrencyPolicy: "Forbid"
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 1
      jobTemplate:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            cronjob: ${NAME}-${ZONE}-restore
        spec:
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: ${NAME}-${ZONE}
                cronjob: ${NAME}-${ZONE}-restore
            spec:
              restartPolicy: "Never"
              terminationGracePeriodSeconds: 30
              volumes:
                - name: scratch
                  emptyDir: {}
              initContainers:
                # 1. Fetch requested or latest backup from S3 to scratch emptyDir
                - name: fetch-s3
                  image: ${AWS_CLI_IMAGE}
                  imagePullPolicy: IfNotPresent
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -eu
                      BACKUP_DIR="/backups"
                      BACKUP_PREFIX="${NAME}/${ZONE}/"
                      S3_TARGET="s3://$S3_BUCKET/${BACKUP_PREFIX}"

                      RESTORE_FILE="${BACKUP_FILE}"
                      if [ -z "$RESTORE_FILE" ]; then
                        echo "Looking up latest backup in $S3_TARGET..."
                        RESTORE_FILE=$(aws s3 ls "$S3_TARGET" | grep ' backup_.*\.dump$' | sort | tail -n 1 | awk '{print $4}')
                      fi

                      if [ -z "$RESTORE_FILE" ]; then
                        echo "No backup file found in $S3_TARGET to restore!"
                        exit 1
                      fi

                      echo "Downloading $S3_TARGET$RESTORE_FILE to $BACKUP_DIR/restore.dump..."
                      aws s3 cp "$S3_TARGET$RESTORE_FILE" "$BACKUP_DIR/restore.dump"
                      echo "Download completed."
                  env:
                    - name: S3_BUCKET
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-bucket
                          optional: true
                    - name: AWS_ENDPOINT_URL
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-endpoint
                          optional: true
                    - name: AWS_ACCESS_KEY_ID
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-user
                          optional: true
                    - name: AWS_SECRET_ACCESS_KEY
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-password
                          optional: true
                    - name: AWS_DEFAULT_REGION
                      value: ca-central-1
                    - name: HOME
                      value: /tmp
                    - name: BACKUP_FILE
                      value: "${BACKUP_FILE}"
                  volumeMounts:
                    - name: scratch
                      mountPath: /backups
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
              containers:
                # 2. Restore dump into database via pg_restore
                - name: restore
                  image: ${DB_IMAGE}:${PG_VERSION}
                  imagePullPolicy: IfNotPresent
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -eu
                      RESTORE_DUMP="/backups/restore.dump"

                      if [ ! -f "$RESTORE_DUMP" ]; then
                        echo "Restore dump file not found: $RESTORE_DUMP"
                        exit 1
                      fi

                      echo "Verifying archive readability..."
                      pg_restore --list "$RESTORE_DUMP" > /dev/null

                      echo "Restoring database from $RESTORE_DUMP into ${NAME}-${ZONE}-${COMPONENT}:${POSTGRES_DB}..."
                      # --clean drops existing database objects before recreating them;
                      # --if-exists avoids errors during drops if objects do not exist.
                      pg_restore \
                        -U "${POSTGRES_USER}" \
                        -h "${NAME}-${ZONE}-${COMPONENT}" \
                        -d "${POSTGRES_DB}" \
                        --clean \
                        --if-exists \
                        --no-owner \
                        --no-privileges \
                        "$RESTORE_DUMP"

                      echo "Database restore completed successfully."
                  env:
                    - name: POSTGRES_DB
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-name
                    - name: POSTGRES_USER
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-user
                    - name: PGPASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-password
                  volumeMounts:
                    - name: scratch
                      mountPath: /backups
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
