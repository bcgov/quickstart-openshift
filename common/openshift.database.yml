apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    required: true
  - name: COMPONENT
    description: Component name
    value: database
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: DB_IMAGE
    description: Database image repository, e.g. postgres, or postgis/postgis for spatial (GIS) support
    value: postgres
  - name: PG_VERSION
    description: Tag for DB_IMAGE, e.g. 17 for postgres or 17-3.5 for postgis/postgis
    value: "17"
  - name: DB_PVC_SIZE
    description: Volume space available for data
    value: 256Mi
  - name: MEMORY_LIMIT
    description: Memory limit for the database container (bounds the pod's working set).
    value: 4Gi
  - name: AWS_CLI_IMAGE
    description: AWS CLI image used for S3 upload and retention pruning
    value: amazon/aws-cli:2.39.1
  - name: BACKUP_SUSPEND
    description: Suspend backup CronJob execution (default true; set false to enable)
    value: "true"
  - name: BACKUP_SCHEDULE
    description: Cron expression for backup execution schedule
    value: "30 8 * * *" # Daily at 08:30 UTC
  - name: NUM_BACKUPS
    description: Number of daily backup dumps to retain in S3 bucket before pruning
    value: "7"
  - name: BACKUP_FILE
    description: Specific backup filename to restore (leave blank for latest backup in S3)
    value: ""

objects:
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      # Governing Service required by the StatefulSet. With a single replica the
      # ClusterIP Service below doubles as both the governing service and the
      # connection endpoint; no separate headless Service is needed.
      serviceName: ${NAME}-${ZONE}-${COMPONENT}
      replicas: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          # Give Postgres time to flush and shut down cleanly on SIGTERM during a node drain.
          terminationGracePeriodSeconds: 60
          containers:
            - name: ${NAME}-${ZONE}
              image: ${DB_IMAGE}:${PG_VERSION}
              imagePullPolicy: Always
              ports:
                - containerPort: 5432
              env:
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-name
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-password
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-user

              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data
                - name: socket-dir
                  mountPath: /var/run/postgresql
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: ${MEMORY_LIMIT}
              # restricted-v2 SCC hardening. readOnlyRootFilesystem is intentionally
              # omitted: the postgres entrypoint writes to several root-fs paths
              # (config, locale, /tmp) beyond the PVC and socket-dir mounts.
              # OpenShift assigns the UID/GID from the namespace range; do not hard-code it.
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              readinessProbe:
                exec:
                  command:
                    - pg_isready
                    - -d
                    - $(POSTGRES_DB)
                    - -U
                    - $(POSTGRES_USER)
                successThreshold: 1
                failureThreshold: 5
                initialDelaySeconds: 15
                periodSeconds: 15
                timeoutSeconds: 10
              livenessProbe:
                exec:
                  command:
                    - pg_isready
                    - -d
                    - $(POSTGRES_DB)
                    - -U
                    - $(POSTGRES_USER)
                successThreshold: 1
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 10
          volumes:
            - name: socket-dir
              emptyDir: {}
      # Per-pod PVC managed by the StatefulSet. The claim-template name is fixed
      # ("data"): volumeClaimTemplates are immutable once the StatefulSet exists,
      # so the name must not embed PG_VERSION. A major Postgres upgrade is a
      # deliberate migration (pg_upgrade or dump/restore), never an automatic
      # volume swap. netapp-block-standard (RWO block) suits a single-writer DB
      # and supports resize-up only.
      volumeClaimTemplates:
        - metadata:
            labels:
              app: ${NAME}-${ZONE}
            name: data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: netapp-block-standard
            resources:
              requests:
                storage: ${DB_PVC_SIZE}
  # ClusterIP Service: the backend connects here via ${NAME}-${ZONE}-${COMPONENT}:5432.
  # A stable virtual IP is the right choice for a single-replica DB; per-pod
  # (headless) DNS would only matter for a multi-replica HA cluster.
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: postgresql
          port: 5432
          targetPort: 5432
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}-backup
      labels:
        app: ${NAME}-${ZONE}
        cronjob: ${NAME}-${ZONE}-backup
    spec:
      schedule: "${BACKUP_SCHEDULE}"
      suspend: ${{BACKUP_SUSPEND}}
      concurrencyPolicy: "Replace"
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      jobTemplate:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            cronjob: ${NAME}-${ZONE}-backup
        spec:
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: ${NAME}-${ZONE}
                cronjob: ${NAME}-${ZONE}-backup
            spec:
              restartPolicy: "Never"
              terminationGracePeriodSeconds: 30
              volumes:
                - name: scratch
                  emptyDir: {}
              initContainers:
                # 1. Dump database with 1:1 pg_dump client/server parity & verify archive TOC
                - name: dump
                  image: ${DB_IMAGE}:${PG_VERSION}
                  imagePullPolicy: IfNotPresent
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -eu
                      BACKUP_DIR="/backups"
                      TARGET_DUMP="${BACKUP_DIR}/backup_$(date +%Y-%m-%d).dump"
                      TEMP_DUMP="${TARGET_DUMP}.tmp"

                      cleanup() {
                        rm -f "${TEMP_DUMP}" || true
                      }
                      trap cleanup EXIT
                      trap 'exit 130' INT
                      trap 'exit 143' TERM

                      echo "Cleaning stale temporary dumps in scratch..."
                      find "${BACKUP_DIR}" -maxdepth 1 -type f -name "*.tmp" -exec rm -f {} \;

                      echo "Creating database dump..."
                      pg_dump \
                        -U "${POSTGRES_USER}" \
                        -h "${NAME}-${ZONE}-${COMPONENT}" \
                        -d "${POSTGRES_DB}" \
                        -Fc \
                        --file="${TEMP_DUMP}"

                      echo "Verifying dump readability and archive integrity..."
                      pg_restore --list "${TEMP_DUMP}" > /dev/null

                      mv "${TEMP_DUMP}" "${TARGET_DUMP}"
                      echo "Dump created and verified successfully: ${TARGET_DUMP}"
                  env:
                    - name: POSTGRES_DB
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-name
                    - name: POSTGRES_USER
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-user
                    - name: PGPASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-password
                  volumeMounts:
                    - name: scratch
                      mountPath: /backups
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
              containers:
                # 2. Upload dump to S3 / ObjectStore and prune remote backups older than NUM_BACKUPS
                - name: s3-sync
                  image: ${AWS_CLI_IMAGE}
                  imagePullPolicy: IfNotPresent
                  entrypoint: ["/bin/sh", "-c"]
                  command:
                    - |
                      set -eu
                      BACKUP_DIR="/backups"
                      BACKUP_PREFIX="${NAME}/${ZONE}/"
                      S3_TARGET="s3://${S3_BUCKET}/${BACKUP_PREFIX}"

                      echo "Uploading database backup to ${S3_TARGET}..."
                      for dump in "${BACKUP_DIR}"/backup_*.dump; do
                        [ -f "${dump}" ] || continue
                        aws s3 cp "${dump}" "${S3_TARGET}"
                        echo "Uploaded $(basename "${dump}") to S3."
                      done

                      echo "Pruning S3 backups older than ${NUM_BACKUPS} days..."
                      PRUNE_CUTOFF_SEC=$(date -d "${NUM_BACKUPS} days ago" +%s)
                      aws s3 ls "${S3_TARGET}" | while read -r date time size filename; do
                        [ -n "${filename:-}" ] || continue
                        case "${filename}" in
                          backup_*.dump)
                            obj_sec=$(date -d "${date} ${time}" +%s 2>/dev/null || :)
                            if [ -n "${obj_sec}" ] && [ "${obj_sec}" -lt "${PRUNE_CUTOFF_SEC}" ]; then
                              echo "Pruning expired backup: ${S3_TARGET}${filename}"
                              aws s3 rm "${S3_TARGET}${filename}"
                            fi
                            ;;
                        esac
                      done
                      echo "S3 sync and retention pruning completed."
                  env:
                    - name: S3_BUCKET
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-bucket
                    - name: AWS_ENDPOINT_URL
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-endpoint
                          optional: true
                    - name: AWS_ACCESS_KEY_ID
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-user
                    - name: AWS_SECRET_ACCESS_KEY
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-password
                    - name: AWS_DEFAULT_REGION
                      value: ca-central-1
                    - name: HOME
                      value: /tmp
                  volumeMounts:
                    - name: scratch
                      mountPath: /backups
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}-restore
      labels:
        app: ${NAME}-${ZONE}
        cronjob: ${NAME}-${ZONE}-restore
    spec:
      schedule: "0 0 31 2 *" # Dormant schedule (Feb 31st never triggers automatically)
      suspend: true
      concurrencyPolicy: "Forbid"
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 1
      jobTemplate:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            cronjob: ${NAME}-${ZONE}-restore
        spec:
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: ${NAME}-${ZONE}
                cronjob: ${NAME}-${ZONE}-restore
            spec:
              restartPolicy: "Never"
              terminationGracePeriodSeconds: 30
              volumes:
                - name: scratch
                  emptyDir: {}
              initContainers:
                # 1. Fetch requested or latest backup from S3 to scratch emptyDir
                - name: fetch-s3
                  image: ${AWS_CLI_IMAGE}
                  imagePullPolicy: IfNotPresent
                  entrypoint: ["/bin/sh", "-c"]
                  command:
                    - |
                      set -eu
                      BACKUP_DIR="/backups"
                      BACKUP_PREFIX="${NAME}/${ZONE}/"
                      S3_TARGET="s3://${S3_BUCKET}/${BACKUP_PREFIX}"

                      RESTORE_FILE="${BACKUP_FILE}"
                      if [ -z "${RESTORE_FILE}" ]; then
                        echo "Looking up latest backup in ${S3_TARGET}..."
                        RESTORE_FILE=$(aws s3 ls "${S3_TARGET}" | grep ' backup_.*\.dump$' | sort | tail -n 1 | awk '{print $4}')
                      fi

                      if [ -z "${RESTORE_FILE}" ]; then
                        echo "No backup file found in ${S3_TARGET} to restore!"
                        exit 1
                      fi

                      echo "Downloading ${S3_TARGET}${RESTORE_FILE} to ${BACKUP_DIR}/restore.dump..."
                      aws s3 cp "${S3_TARGET}${RESTORE_FILE}" "${BACKUP_DIR}/restore.dump"
                      echo "Download completed."
                  env:
                    - name: S3_BUCKET
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-bucket
                    - name: AWS_ENDPOINT_URL
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-endpoint
                          optional: true
                    - name: AWS_ACCESS_KEY_ID
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-user
                    - name: AWS_SECRET_ACCESS_KEY
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database-backup
                          key: s3-password
                    - name: AWS_DEFAULT_REGION
                      value: ca-central-1
                    - name: HOME
                      value: /tmp
                    - name: BACKUP_FILE
                      value: "${BACKUP_FILE}"
                  volumeMounts:
                    - name: scratch
                      mountPath: /backups
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
              containers:
                # 2. Restore dump into database via pg_restore
                - name: restore
                  image: ${DB_IMAGE}:${PG_VERSION}
                  imagePullPolicy: IfNotPresent
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -eu
                      RESTORE_DUMP="/backups/restore.dump"

                      if [ ! -f "${RESTORE_DUMP}" ]; then
                        echo "Restore dump file not found: ${RESTORE_DUMP}"
                        exit 1
                      fi

                      echo "Verifying archive readability..."
                      pg_restore --list "${RESTORE_DUMP}" > /dev/null

                      echo "Restoring database from ${RESTORE_DUMP} into ${NAME}-${ZONE}-${COMPONENT}:${POSTGRES_DB}..."
                      # --clean drops existing database objects before recreating them;
                      # --if-exists avoids errors during drops if objects do not exist.
                      pg_restore \
                        -U "${POSTGRES_USER}" \
                        -h "${NAME}-${ZONE}-${COMPONENT}" \
                        -d "${POSTGRES_DB}" \
                        --clean \
                        --if-exists \
                        --no-owner \
                        --no-privileges \
                        "${RESTORE_DUMP}"

                      echo "Database restore completed successfully."
                  env:
                    - name: POSTGRES_DB
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-name
                    - name: POSTGRES_USER
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-user
                    - name: PGPASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ${NAME}-${ZONE}-database
                          key: database-password
                  volumeMounts:
                    - name: scratch
                      mountPath: /backups
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
