# Reusable Deploy - Lite Mode Verification
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      triggers:
        description: Triggers for deployment
        default: ""
        type: string

    secrets:
      db_password:
        description: Database password
        required: true
      oc_token:
        description: OpenShift token
        required: true
      s3_user:
        description: S3 access key ID for backups
        required: false
      s3_password:
        description: S3 secret access key for backups
        required: false
    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.init.outputs.triggered }}

permissions: {}

jobs:
  init:
    name: Deploy (init)
    environment: ${{ inputs.environment }}
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    runs-on: ubuntu-26.04
    steps:
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        id: deploy
        env:
          DB_PASSWORD: ${{ secrets.db_password }}
        with:
          file: common/openshift.init.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          # Secret + NetworkPolicies: create if missing. Postgres ignores
          # POSTGRES_PASSWORD after first boot; restamping the Secret desyncs Flyway.
          # New NetworkPolicy names still apply; existing NP specs do not update.
          overwrite: false
          parameters: -p DB_PASSWORD="$DB_PASSWORD"
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
          triggers: ${{ inputs.triggers }}
          debug: true

  deploy:
    name: Deploy (${{ matrix.name }})
    environment: ${{ inputs.environment }}
    needs: [init]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      matrix:
        name: [database, backend, frontend]
        include:
          - name: database
            file: common/openshift.database.yml
            parameters: -p DB_PVC_SIZE="256Mi"
          - name: backend
            file: backend/openshift.deploy.yml
            parameters: -p IMAGE_TAG="${{ inputs.tag }}"
          - name: frontend
            file: frontend/openshift.deploy.yml
            parameters: -p IMAGE_TAG="${{ inputs.tag }}"
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        id: deploy
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: true
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            ${{ matrix.parameters }}
          triggers: ${{ inputs.triggers }}

  # Disaster-recovery database backups and restore CronJobs for PROD environments.
  # Deployed with overwrite: true so S3 credential rotation and schedule changes
  # update in-cluster immediately without touching the core database StatefulSet.
  backup:
    name: Deploy (backup)
    environment: ${{ inputs.environment }}
    needs: [deploy]
    if: inputs.environment == 'prod'
    runs-on: ubuntu-26.04
    steps:
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        id: deploy
        env:
          S3_USER: ${{ secrets.s3_user }}
          S3_PASSWORD: ${{ secrets.s3_password }}
        with:
          file: common/openshift.backup.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          overwrite: true
          parameters: -p S3_BUCKET="${{ vars.S3_BUCKET }}"
            -p S3_ENDPOINT="${{ vars.S3_ENDPOINT }}"
            -p S3_USER="$S3_USER"
            -p S3_PASSWORD="$S3_PASSWORD"
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
          triggers: ${{ inputs.triggers }}
          debug: true
