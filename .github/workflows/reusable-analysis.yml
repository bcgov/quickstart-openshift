name: Reusable Analysis

on:
  workflow_call:

permissions: {}

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: default
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: bcgov/action-test-and-analyse@8f699e3fd3fadd9a6adf6f4b1f2638ef7ecfefb9 # v2.0.0
        env:
          sonar_token: ${{ secrets.sonar_token_backend }}
        with:
          commands: |
            npm ci
            npm run lint
            npm run format:check
            npm run test:cov
          dir: backend
          node_version: "22"
          sonar_args: >
            -Dsonar.exclusions=**/coverage/**,**/node_modules/**,**/*spec.ts
            -Dsonar.organization=bcgov-sonarcloud
            -Dsonar.projectKey=quickstart-openshift_backend
            -Dsonar.sources=src
            -Dsonar.test.inclusions=**/*spec.ts
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info
          sonar_token: ${{ env.sonar_token }}
          dep_scan: warn
          supply_scan: true
          triggers: ('backend/')

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: bcgov/action-test-and-analyse@8f699e3fd3fadd9a6adf6f4b1f2638ef7ecfefb9 # v2.0.0
        env:
          sonar_token: ${{ secrets.sonar_token_frontend }}
        with:
          commands: |
            npm ci
            npm run lint
            npm run format:check
            npm run test:cov
          dir: frontend
          node_version: "22"
          sonar_args: >
            -Dsonar.exclusions=**/coverage/**,**/node_modules/**,**/*spec.ts,**/*test.tsx,**/routeTree.gen.ts
            -Dsonar.organization=bcgov-sonarcloud
            -Dsonar.projectKey=quickstart-openshift_frontend
            -Dsonar.sources=src
            -Dsonar.test.inclusions=**/*spec.ts,**/*test.tsx
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info
          sonar_token: ${{ env.sonar_token }}
          dep_scan: warn
          supply_scan: true
          triggers: ('frontend/')

  trivy:
    name: Trivy Security Scan
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - id: diff
        uses: bcgov/actions/diff-triggers@4ad61a784f1c17765b03d8d6de9737c1d3f4c0f2 # v0.5.0
        with:
          triggers: |
            backend/**
            frontend/**
            common/**
            package*.json
            Containerfile*
            compose*.yml
            .github/**

      - name: Cache Trivy DB
        if: steps.diff.outputs.triggered == 'true'
        uses: actions/cache@v6
        with:
          path: .trivycache
          key: ${{ runner.os }}-trivy-${{ hashFiles('.github/workflows/reusable-analysis.yml') }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Scan for secrets and misconfigurations
        if: steps.diff.outputs.triggered == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "secret,misconfig"
          severity: "CRITICAL,HIGH"
          trivyignores: ".github/.trivyignore"
          cache-dir: .trivycache
          skip-dirs: "**/node_modules,**/coverage,**/dist,.git"
          exit-code: "1"

      - name: Run Trivy vulnerability scanner in repo mode
        if: steps.diff.outputs.triggered == 'true' && (success() || failure())
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          trivyignores: ".github/.trivyignore"
          cache-dir: .trivycache
          skip-dirs: "**/node_modules,**/coverage,**/dist,.git"
          exit-code: "0"

      - name: Upload Trivy scan results to GitHub Security tab
        if: steps.diff.outputs.triggered == 'true' && (success() || failure())
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: "trivy"
          sarif_file: "trivy-results.sarif"

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  analysis-results:
    name: Analysis Results
    needs: [backend-tests, frontend-tests, trivy]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Log Job Results Context
        run: |
          echo "=== Upstream Job Statuses ==="
          echo '${{ toJson(needs) }}'

      - name: Evaluate Overall Status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ Critical Check Failure: At least one required job has failed or was cancelled."
          exit 1

      - name: Success Message
        run: echo "✅ All critical checks passed or were intentionally skipped!"
