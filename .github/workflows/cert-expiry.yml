name: Cert Expiry

on:
  schedule:
    # Monday 08:17 PT (15:17 UTC)
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  cert-expiry:
    name: TLS Certificate Expiry
    if: vars.ROUTE_HOST != ''
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # workflow-notifier reads CODEOWNERS from the workspace
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check certificate expiry
        id: check
        uses: bcgov/actions-openshift/cert-expiry@6b0840fb200317eb4c806caeef8a4fda42d528e6 # v0.8.0
        with:
          hosts: ${{ vars.ROUTE_HOST }}

      - name: Notify CODEOWNERS
        if: failure() && steps.check.outputs.findings != '' && steps.check.outputs.findings != '[]'
        uses: bcgov/actions/workflow-notifier@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          title: "TLS certificate expiring or unreadable"
          labels: ""
          notify_author: "false"
          notify_codeowners: "true"
