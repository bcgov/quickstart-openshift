name: Cert Expiry

on:
  schedule:
    # Monday 08:17 PT (15:17 UTC)
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  cert-expiry:
    name: TLS Certificate Expiry
    if: vars.ROUTE_HOST != ''
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # workflow-notifier reads CODEOWNERS from the workspace
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check certificate expiry
        id: check
        uses: bcgov/actions-openshift/cert-expiry@4dbe4f6d25d14cbdb01e525a302e61e31f96c3ed # v0.5.0
        with:
          hosts: ${{ vars.ROUTE_HOST }}
          days: "30"

      - name: Notify CODEOWNERS
        if: failure() && steps.check.outputs.findings != '' && steps.check.outputs.findings != '[]'
        uses: bcgov/actions/workflow-notifier@122a9b1c6c082b1b1f18c300020fbdc417b6b0b2 # v0.10.0
        with:
          title: "TLS certificate expiring or unreadable"
          labels: ""
          notify_author: "false"
          notify_codeowners: "true"
