name: Route TLS

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run. True = validate only, false = apply."
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  route-tls:
    name: Route TLS (dry_run=${{ inputs.dry_run }})
    environment: prod
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: bcgov/actions-openshift/route-tls@97cb3f8a5a6d134594c85224d3f593e3c0e90647 # v0.4.0
        with:
          hostname: ${{ vars.ROUTE_HOST }}
          target_service: ${{ github.event.repository.name }}-prod-frontend
          tls_certificate: ${{ secrets.TLS_CERTIFICATE }}
          tls_private_key: ${{ secrets.TLS_PRIVATE_KEY }}
          tls_ca_certificate: ${{ secrets.TLS_CA_CERTIFICATE }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          dry_run: ${{ inputs.dry_run }}
