name: PR

on:
  pull_request:

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/action-builder-ghcr
  builds:
    name: Builds
    permissions:
      attestations: write
      id-token: write
      packages: write
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          # The PR tag is mutable (reused every push) and is what merge.yml
          # deploys/promotes; the head SHA tag is immutable and is what PR
          # deploys use, so each push changes the pod spec and forces a rollout.
          tags: |
            ${{ github.event.number }}
            ${{ github.event.pull_request.head.sha }}
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/', '.github/workflows/pr-open.yml')

  deploys:
    name: Deploys (${{ github.event.number }})
    needs: [builds]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      db_password: ${{ secrets.db_password }}
      oc_token: ${{ secrets.oc_token }}
    with:
      target: ${{ github.event.number }}
      tag: ${{ github.event.pull_request.head.sha }}
      triggers: ('backend/', 'frontend/', 'migrations/', 'common/', '.github/workflows/pr-open.yml')

  tests:
    name: Tests
    if: needs.deploys.outputs.triggered == 'true'
    needs: [deploys]
    uses: ./.github/workflows/reusable-tests.yml

  comment:
    name: Deployment Links
    needs: [deploys]
    if: needs.deploys.outputs.triggered == 'true'
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    steps:
      - name: Post Deploy Links
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-deployment-links
          message: |
            ### 🚀 Deployments Available
            - [Frontend](https://${{ github.event.repository.name }}-${{ github.event.number }}.apps.silver.devops.gov.bc.ca)
            - [Backend](https://${{ github.event.repository.name }}-${{ github.event.number }}.apps.silver.devops.gov.bc.ca/api)

  # Test-only (#2928): self-signed vanity host on the PR frontend; not for merge
  vanity:
    name: Vanity TLS (self-signed)
    needs: [deploys]
    if: needs.deploys.outputs.triggered == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Mint self-signed cert
        id: cert
        run: |
          OUT="${RUNNER_TEMP}/tls" bash scripts/tls-canary-cert.sh quickstart.nrs.gov.bc.ca 7
          while IFS= read -r line; do
            [[ -n "$line" && "$line" != -----* ]] && echo "::add-mask::${line}"
          done < "${RUNNER_TEMP}/tls/key.pem"
          for f in leaf key ca; do
            { echo "${f}<<PEM_EOF"; cat "${RUNNER_TEMP}/tls/${f}.pem"; echo "PEM_EOF"; } >> "$GITHUB_OUTPUT"
          done
          rm -rf "${RUNNER_TEMP}/tls"

      - uses: bcgov/actions-openshift/route-tls@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          hostname: quickstart.nrs.gov.bc.ca
          route_name: ${{ github.event.repository.name }}-${{ github.event.number }}-vanity
          target_service: ${{ github.event.repository.name }}-${{ github.event.number }}-frontend
          tls_certificate: ${{ steps.cert.outputs.leaf }}
          tls_private_key: ${{ steps.cert.outputs.key }}
          tls_ca_certificate: ${{ steps.cert.outputs.ca }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          dry_run: false

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: PR Results
    needs: [builds, deploys, tests, comment, vanity]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@122a9b1c6c082b1b1f18c300020fbdc417b6b0b2 # v0.10.0
        with:
          needs: ${{ toJson(needs) }}
