name: PR

on:
  pull_request:

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/action-builder-ghcr
  builds:
    name: Builds
    permissions:
      attestations: write
      id-token: write
      packages: write
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          # The PR tag is mutable (reused every push) and is what merge.yml
          # deploys/promotes; the head SHA tag is immutable and is what PR
          # deploys use, so each push changes the pod spec and forces a rollout.
          tags: |
            ${{ github.event.number }}
            ${{ github.event.pull_request.head.sha }}
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/', '.github/workflows/pr-open.yml')

  deploys:
    name: Deploys (${{ github.event.number }})
    needs: [builds]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      db_password: ${{ secrets.db_password }}
      oc_token: ${{ secrets.oc_token }}
    with:
      target: ${{ github.event.number }}
      tag: ${{ github.event.pull_request.head.sha }}
      triggers: ('backend/', 'frontend/', 'migrations/', 'common/', '.github/workflows/pr-open.yml')

  tests:
    name: Tests
    if: needs.deploys.outputs.triggered == 'true'
    needs: [deploys]
    uses: ./.github/workflows/reusable-tests.yml

  comment:
    name: Deployment Links
    needs: [deploys]
    if: needs.deploys.outputs.triggered == 'true'
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    steps:
      - name: Post Deploy Links
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-deployment-links
          message: |
            ### 🚀 Deployments Available
            - [Frontend](https://${{ github.event.repository.name }}-${{ github.event.number }}.apps.silver.devops.gov.bc.ca)
            - [Backend](https://${{ github.event.repository.name }}-${{ github.event.number }}.apps.silver.devops.gov.bc.ca/api)

  # Test-only (#2928, bcgov/actions-openshift#153): Let's Encrypt STAGING via HTTP-01
  # on the PR frontend vanity host; not for merge
  vanity:
    name: Vanity TLS (ACME staging)
    needs: [deploys]
    # Off: a production certificate is live, and each run would replace it
    if: false
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Unreleased: head of bcgov/actions-openshift#155
      - name: ACME HTTP-01
        id: acme
        uses: bcgov/actions-openshift/acme-http01@5316d1e17852689bda229d7f0a54f6184df31d6f # feat/acme-http01
        with:
          hostname: quickstart.nrs.gov.bc.ca
          email: derek.roberts@gmail.com
          acme_server: production
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}

      - uses: bcgov/actions-openshift/route-tls@6b43d38d1b7420bc69594202ad5c281dcda31d20 # fix/route-tls-api-retry
        with:
          hostname: quickstart.nrs.gov.bc.ca
          route_name: ${{ github.event.repository.name }}-${{ github.event.number }}-vanity
          target_service: ${{ github.event.repository.name }}-${{ github.event.number }}-frontend
          tls_certificate: ${{ steps.acme.outputs.tls_certificate }}
          tls_private_key: ${{ steps.acme.outputs.tls_private_key }}
          tls_ca_certificate: ${{ steps.acme.outputs.tls_ca_certificate }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          dry_run: false

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: PR Results
    needs: [builds, deploys, tests, comment, vanity]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          needs: ${{ toJson(needs) }}
