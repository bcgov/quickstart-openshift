name: PR

on:
  pull_request:

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/action-builder-ghcr
  builds:
    name: Builds
    permissions:
      attestations: write
      id-token: write
      packages: write
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          # The PR tag is mutable (reused every push) and is what merge.yml
          # deploys/promotes; the head SHA tag is immutable and is what PR
          # deploys use, so each push changes the pod spec and forces a rollout.
          tags: |
            ${{ github.event.number }}
            ${{ github.event.pull_request.head.sha }}
          tag_fallback: latest
          triggers: |
            ${{ matrix.package }}/
            .github/workflows/pr-open.yml

  # One image-tracker call: every package's digest for this PR, by OCI label
  images:
    name: Images
    needs: [builds]
    permissions:
      contents: read
      packages: read
      pull-requests: read
    outputs:
      images: ${{ steps.tracker.outputs.images }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tracker
        uses: bcgov/actions/image-tracker@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          # Unchanged packages reuse an earlier image, so walk back far enough to find it
          max_depth: 100
          packages: |
            migrations
            backend
            frontend
          revision: ${{ github.event.pull_request.head.sha }}

  deploys:
    name: Deploys (${{ github.event.number }})
    needs: [images]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      db_password: ${{ secrets.db_password }}
      oc_token: ${{ secrets.oc_token }}
    with:
      target: ${{ github.event.number }}
      images: ${{ needs.images.outputs.images }}
      triggers: |
        backend/
        frontend/
        migrations/
        common/
        .github/workflows/pr-open.yml

  tests:
    name: Tests
    if: needs.deploys.outputs.triggered == 'true'
    needs: [deploys]
    uses: ./.github/workflows/reusable-tests.yml

  comment:
    name: Deployment Links
    needs: [deploys]
    if: needs.deploys.outputs.triggered == 'true'
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    steps:
      - name: Post Deploy Links
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-deployment-links
          message: |
            ### 🚀 Deployments Available
            - [Frontend](https://${{ github.event.repository.name }}-${{ github.event.number }}.apps.silver.devops.gov.bc.ca)
            - [Backend](https://${{ github.event.repository.name }}-${{ github.event.number }}.apps.silver.devops.gov.bc.ca/api)

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: PR Results
    needs: [builds, images, deploys, tests, comment]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          needs: ${{ toJson(needs) }}
