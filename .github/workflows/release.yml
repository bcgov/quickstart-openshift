name: Release

# Publishing a GitHub release deploys that release to PROD. It reuses the
# image digests merge.yml deployed for the release's commit and does not
# rebuild anything.

on:
  release:
    types: [published]

# Same group as merge.yml (its workflow name), so the two never deploy PROD at once
concurrency:
  group: Merge
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
      packages: read
    outputs:
      images: ${{ steps.tracker.outputs.images }}
      pr: ${{ steps.tracker.outputs.pr }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # One call: the digests merge.yml deployed for the release's commit.
      # A miss fails the release; nothing is rebuilt.
      - id: tracker
        uses: bcgov/actions/image-tracker@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          max_depth: 100
          packages: |
            migrations
            backend
            frontend

  deploy-prod:
    name: PROD Deploys (${{ needs.init.outputs.pr }})
    needs: [init]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      db_password: ${{ secrets.db_password }}
      oc_token: ${{ secrets.oc_token }}
    with:
      environment: prod
      target: prod
      images: ${{ needs.init.outputs.images }}

  # Same as merge.yml's monitor-prod; no-ops if SYSDIG_API_TOKEN is unset
  monitor-prod:
    name: Sysdig Monitor (PROD)
    needs: [deploy-prod]
    runs-on: ubuntu-26.04
    environment: prod
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: bcgov/actions-openshift/sysdig-monitor@4dbe4f6d25d14cbdb01e525a302e61e31f96c3ed # v0.5.0
        with:
          sysdig_api_token: ${{ secrets.SYSDIG_API_TOKEN }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          app: ${{ github.event.repository.name }}
