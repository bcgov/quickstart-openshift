name: Release

# Publishing a GitHub release deploys that release to PROD. It reuses the
# image digests merge.yml deployed for the release's commit and does not
# rebuild anything.

on:
  release:
    types: [published]

# Same group as merge.yml (its workflow name), so the two never deploy PROD at once
concurrency:
  group: Merge
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
      packages: read
    outputs:
      digests: ${{ steps.tracker.outputs.digests }}
      pr: ${{ steps.tracker.outputs.pr }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # One call: the digests merge.yml deployed for the release's commit.
      # A miss fails the release; nothing is rebuilt.
      - id: tracker
        uses: bcgov/actions/image-tracker@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          max_depth: 100
          packages: |
            migrations
            backend
            frontend

  deploy-prod:
    name: PROD Deploys (${{ needs.init.outputs.pr }})
    needs: [init]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      db_password: ${{ secrets.db_password }}
      oc_token: ${{ secrets.oc_token }}
      s3_user: ${{ secrets.s3_user }}
      s3_password: ${{ secrets.s3_password }}
    with:
      environment: prod
      target: prod
      digests: ${{ needs.init.outputs.digests }}

  # Same as merge.yml's monitor-prod; no-ops if SYSDIG_API_TOKEN is unset
  monitor-prod:
    name: Sysdig Monitor (PROD)
    needs: [deploy-prod]
    runs-on: ubuntu-26.04
    environment: prod
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: bcgov/actions-openshift/sysdig-monitor@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          sysdig_api_token: ${{ secrets.SYSDIG_API_TOKEN }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          app: ${{ github.event.repository.name }}
          components: |
            frontend
            backend

  results:
    name: Release Results
    needs: [init, deploy-prod, monitor-prod]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: bcgov/actions/workflow-results@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          needs: ${{ toJson(needs) }}
          title: Release Results
