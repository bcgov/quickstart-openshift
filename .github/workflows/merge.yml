name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
      packages: write # image-tracker tags
    outputs:
      images: ${{ steps.tracker.outputs.images }}
      pr: ${{ steps.tracker.outputs.pr }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # One call: every package's digest for this commit, plus the latest tag.
      # A squash merge was never built, so walk back to the last image per package.
      - id: tracker
        uses: bcgov/actions/image-tracker@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          max_depth: 100
          packages: |
            migrations
            backend
            frontend
          tags: |
            latest
  deploy-test:
    name: TEST Deploys (${{ needs.init.outputs.pr }})
    needs: [init]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      db_password: ${{ secrets.db_password }}
      oc_token: ${{ secrets.oc_token }}
    with:
      environment: test
      target: test
      images: ${{ needs.init.outputs.images }}

  tests:
    name: Tests
    needs: [deploy-test]
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: test

  # PROD on every merge. For PROD only on releases, comment out deploy-prod
  # and monitor-prod below; release.yml then handles PROD.
  deploy-prod:
    name: PROD Deploys (${{ needs.init.outputs.pr }})
    needs: [tests, init]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      db_password: ${{ secrets.db_password }}
      oc_token: ${{ secrets.oc_token }}
      s3_user: ${{ secrets.s3_user }}
      s3_password: ${{ secrets.s3_password }}
    with:
      environment: prod
      target: prod
      images: ${{ needs.init.outputs.images }}

  # Sync Sysdig email alerts for PROD. No-ops cleanly if SYSDIG_API_TOKEN is
  # unset or monitoring/alerts/ is empty — adoption is gradual. Alert
  # templates live in monitoring/alerts/ in this repo; add or remove files
  # there to customize the alert set.
  monitor-prod:
    name: Sysdig Monitor (PROD)
    needs: [deploy-prod]
    runs-on: ubuntu-26.04
    environment: prod
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # 0.0.3 is the first version with __APP__ template substitution, which
      # monitoring/alerts/*.json depend on — don't downgrade this pin.
      - uses: bcgov/actions-openshift/sysdig-monitor@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          sysdig_api_token: ${{ secrets.SYSDIG_API_TOKEN }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          app: ${{ github.event.repository.name }}
          components: |
            frontend
            backend

  # Promote/retag is handled by image-tracker `tags` in init (latest). The old
  # mutable PR-tag → prod promote matrix is removed so PROD gets the same
  # digests that were tested.

  results:
    name: Merge Results
    needs: [init, deploy-test, tests, deploy-prod, monitor-prod]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: bcgov/actions/workflow-results@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          needs: ${{ toJson(needs) }}
          title: Merge Results
